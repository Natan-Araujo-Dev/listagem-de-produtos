<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="registerStyle.css">
    <script src="registerCode.js" defer></script>
</head>
<body>
    
    <span><h1>Adicione seu produto</h1></span>
    
    <span>
        <table id="mainTable">
            <tr>
                <td>
                    <input type="text" id="productName" placeholder="Nome do produto">
                </td>

                <td colspan="1">
                    <input type="number" id="productValue" placeholder="Valor do produto">
                    <br>
                    Disponível para venda?
                    <select id="productDisponibility">
                        <option>sim</option>
                        <option>não</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <span class="file-upload">
                        <label for="fileInput"><img src="assets\images\placeHolderImagem.jpg" id="registerImage" class="cardImage"></label>
                        <input type="file" id="fileInput" style="display: none;" onchange="getImage(event)">
                    </span>
                </td>

                <td colspan="3" id="bottomTableElement">
                    <input type="text" id="productDescription" placeholder="Descrição do produto">
                </td>
            </tr>

            <tr>
                <td>
                    <button type="submit" id="sendButton">Enviar</button>
                </td>
            </tr>
        </table>
    </span>

</body>
</html>
