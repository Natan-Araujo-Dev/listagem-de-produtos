<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="defaultStyle.css">
    <script src="mainCode.js" defer></script>
</head>
<body>
    
    <span id="mainHeader"><h1>Adicione seu produto</h1></span> <br> <br> <br> <br> <br>
    
    <span id="box">
        <table id="mainTable">
            <tr id="firstTr">
                <td colspan="1">
                    <input type="text" id="productName" placeholder="Nome do produto" class="defaultInputfield">
                </td>

                <td colspan="1">
                    <input type="number" id="productValue" placeholder="Valor do produto" class="defaultInputfield">
                </td>

                <td colspan="1">
                    Disponível para venda
                    <select id="productState">
                        <option>sim</option>
                        <option>não</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="3">
                    <input type="text" id="productDescription" placeholder="Descrição do produto">
                </td>
            </tr>
        </table>
    </span>

</body>
</html>
