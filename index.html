<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="registerStyle.css">
    <script src="registerCode.js" defer></script>
</head>
<body>
    
    <span><h1 id="mainHeader">Adicione seu produto</h1>
    
    <span id="box">
        <table id="mainTable">
            <tr id="firstTr">
                <td colspan="1" class="topTableElements">
                    <input type="text" id="productName" placeholder="Nome do produto" class="defaultInputfield">
                </td>

                <td colspan="1" class="topTableElements">
                    <input type="number" id="productValue" placeholder="Valor do produto" class="defaultInputfield">
                </td>

                <td colspan="1" class="topTableElements">
                    Disponível para venda
                    <select id="productState">
                        <option>sim</option>
                        <option>não</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="3" id="bottomTableElement">
                    <input type="text" id="productDescription" placeholder="Descrição do produto">

                    <button type="submit" id="sendButton">Enviar</button>
                </td>
            </tr>
        </table>
    </span>

</body>
</html>
